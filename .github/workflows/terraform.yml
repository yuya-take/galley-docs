name: Terraform

# deploy/aws の Terraform を、Terraform と OpenTofu のそれぞれで確かめる。AWS には触らない
# （init は -backend=false、test はモックのプロバイダーで動かす）。Lambda@Edge とオーソライザーの
# Node.js のコードは、node --test で確かめる。
on:
  pull_request:
    branches: [main, develop]
    paths:
      - deploy/aws/**
      - .github/workflows/terraform.yml
  push:
    branches: [main, develop]
    paths:
      - deploy/aws/**
      - .github/workflows/terraform.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - run: ${{ matrix.tool }} version
      - run: ${{ matrix.tool }} fmt -check -recursive -diff
      - run: ${{ matrix.tool }} init -backend=false -input=false
      - run: ${{ matrix.tool }} validate
      - run: ${{ matrix.tool }} test

  functions:
    name: functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lambda のランタイム（nodejs24.x）と同じメジャーにする
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test 'deploy/aws/edge/test/*.test.js' 'deploy/aws/authorizer/test/*.test.js'
