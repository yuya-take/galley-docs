name: Docker

# Docker イメージをビルドして起動を確かめる。タグ（v*）のときだけ ghcr.io に push する。
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # QEMU では Rust のビルドが遅すぎるので、アーキテクチャごとにネイティブのランナーでビルドする
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            rie: aws-lambda-rie-x86_64
            rie-sha256: 5ccd1df155e92aa3eb055e60fba492afdebf424626a7983b13a39aa5c2b71616
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            rie: aws-lambda-rie-arm64
            rie-sha256: 65ade4687c22c308ff7acac6974d088d8aafaadea59e61985a083bad86f921d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: ビルド
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: galley:test
          load: true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: 起動を確かめる
        run: |
          docker run -d --name galley -p 8080:8080 -p 8081:8081 -e TZ=Asia/Tokyo galley:test
          # 画面と、画面のアセット（topcoat asset bundle で作ったもの）。起動するまでは
          # Docker のポート転送が接続を受けてすぐ閉じるので、すべてのエラーで再試行する
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 -o page.html http://localhost:8080/
          assets=$(grep -oE '/_topcoat/assets/[^"]+' page.html | sort -u)
          test -n "$assets"
          for asset in $assets; do
            curl -fsS -o /dev/null "http://localhost:8080$asset"
          done
          # 資料配信（存在しない版は 404）
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8081/)" = 404
          # DB が /data にできている（nonroot で書き込める）
          docker cp galley:/data/galley.db - > /dev/null
          # TZ で使う tzdata
          docker cp galley:/usr/share/zoneinfo/Asia/Tokyo - > /dev/null
          # SIGTERM で止まる（無視されると 10 秒後に SIGKILL され、終了コードが 137 になる）
          docker stop galley
          test "$(docker inspect -f '{{.State.ExitCode}}' galley)" = 0

      # Lambda のエミュレーター（aws-lambda-rie）で、Lambda のコンテナイメージとして動かす。
      # RIE は /opt/extensions の Lambda Web Adapter も起動する（deploy/aws/README.md）
      - name: Lambda として動くかを確かめる
        env:
          RIE_VERSION: v1.38
          RIE: ${{ matrix.rie }}
          RIE_SHA256: ${{ matrix.rie-sha256 }}
        run: |
          curl -fsSL --retry 5 -o aws-lambda-rie \
            "https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/download/$RIE_VERSION/$RIE"
          echo "$RIE_SHA256  aws-lambda-rie" | sha256sum -c -
          chmod +x aws-lambda-rie
          # アプリが :8080 で待ち受けるので、RIE は :9000 で呼び出しを受ける
          docker run -d --name galley-lambda -p 9000:9000 \
            -v "$PWD/aws-lambda-rie:/aws-lambda-rie:ro" \
            -e GALLEY_DATA_DIR=/tmp -e GALLEY_VIEWER_ADDR=127.0.0.1:8081 \
            --entrypoint /aws-lambda-rie galley:test \
            --runtime-interface-emulator-address 0.0.0.0:9000 /app/galley
          # API Gateway HTTP API（ペイロード 2.0）の形で GET する。statusCode と本文を出す
          invoke() {
            jq -n --arg path "$1" '{
              version: "2.0", routeKey: "$default", rawPath: $path, rawQueryString: "",
              headers: {host: "localhost"},
              requestContext: {http: {method: "GET", path: $path, protocol: "HTTP/1.1", sourceIp: "127.0.0.1", userAgent: "ci"},
                domainName: "localhost", requestId: "ci", routeKey: "$default", stage: "$default", timeEpoch: 0},
              isBase64Encoded: false}' \
            | curl -fsS --retry 30 --retry-all-errors --retry-delay 1 -d @- \
                http://localhost:9000/2015-03-31/functions/function/invocations
          }
          invoke / > lambda-page.json
          test "$(jq -r .statusCode lambda-page.json)" = 200
          jq -r .body lambda-page.json > lambda-page.html
          assets=$(grep -oE '/_topcoat/assets/[^"]+' lambda-page.html | sort -u)
          test -n "$assets"
          for asset in $assets; do
            test "$(invoke "$asset" | jq -r .statusCode)" = 200
          done
          # Lambda Web Adapter が拡張として登録された（grep -q は途中で閉じて docker logs が SIGPIPE になるので使わない）
          docker logs galley-lambda 2>&1 | grep 'External agent lambda-adapter'
      - name: ログ
        if: always()
        run: |
          docker logs galley || true
          docker logs galley-lambda || true

      - name: ghcr.io にログイン
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # タグは merge でまとめて付けるので、ここでは digest だけで push する（ビルドはキャッシュから）
      - name: push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
      - name: digest を書き出す
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 2 つのアーキテクチャのイメージを 1 つのタグにまとめる（0.1.2・0.1・latest）
  merge:
    name: merge
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 0.x のあいだは major だけのタグ（0）を付けない
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: タグを付けて push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: 確認
        run: docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
