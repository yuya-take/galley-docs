name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml のバージョンとコンポーネントを入れる
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      # DynamoDB の adapter の結合テスト用（メモリ上で動く）。タグとダイジェスト（マルチアーキテクチャのインデックス）で固定する
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --workspace --locked
      # 同じ結合テストを DynamoDB Local でも流す（crates/core/tests/common）
      - name: cargo test（DynamoDB Local）
        run: cargo test -p galley-core --locked --test repository --test revision --test purge --test dynamodb
        env:
          GALLEY_TEST_DYNAMODB_ENDPOINT: http://localhost:8000

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # galley-core は画面・ルーター・フレームワークに依存してはいけない（.claude/rules/clean-architecture.md）
      - name: galley-core の依存を検査
        run: |
          forbidden='^(galley-web|galley-server|topcoat|axum|rmcp) '
          deps=$(cargo tree -p galley-core --edges normal --prefix none --locked)
          if echo "$deps" | grep -E "$forbidden"; then
            echo "::error::galley-core が禁止された依存を持っています"
            exit 1
          fi
