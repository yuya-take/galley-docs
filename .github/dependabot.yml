version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # toasty（0.11）が jiff 0.2 の型を使っているため、jiff だけ 1.x に上げると型が合わずビルドできない。
      # toasty が jiff 1.x に対応したら外す
      - dependency-name: jiff
        update-types: ["version-update:semver-major"]
